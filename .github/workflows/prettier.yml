name: Prettier code formatter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRETTIER_TARGETS: >-
    _config.yml
    .github/workflows/deploy.yml
    .github/workflows/prettier.yml
    .github/workflows/unit-tests.yml
    .github/workflows/visual-regression.yml
    _includes/lcb_nav.html
    _includes/lcb_style.html
    _pages/about.md
    _pages/gallery.md
    _pages/members.md
    _pages/professor.md
    _pages/research.md
    assets/img/README_images.md
    assets/img/gallery/README_gallery_images.md
    test/style_contract.js

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Prettier
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Prettier Check
        id: prettier
        run: npx prettier $PRETTIER_TARGETS --check

      - name: Create diff
        if: ${{ failure() }}
        run: |
          npx prettier $PRETTIER_TARGETS --write
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Upload html diff
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7

      - name: Dispatch information to repository
        if: ${{ failure() && steps.prettier.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: prettier-failed-on-pr
          client-payload: '{"pr_number": "${{ github.event.number }}", "artifact_url": "${{ steps.artifact-upload.outputs.artifact-url }}", "run_id": "${{ github.run_id }}"}'
