<header class="lcb-force-header" role="banner">
  <div class="lcb-force-nav-wrap">
    <a class="lcb-force-brand" href="{{ '/' | relative_url }}" aria-label="Lab of Cancer Biology home">
      <img src="{{ '/assets/img/lab_logo_mark_transparent.png' | relative_url }}" alt="Lab of Cancer Biology logo" />
      <span>Lab of Cancer Biology</span>
    </a>
    <nav class="lcb-force-nav" aria-label="Main navigation">
      <a class="{% if page.permalink == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="{% if page.url contains '/research/' or page.url contains '/projects/' or page.url contains '/approaches/' %}active{% endif %}" href="{{ '/research/' | relative_url }}">Research</a>
      <a class="{% if page.url contains '/professor/' %}active{% endif %}" href="{{ '/professor/' | relative_url }}">Professor</a>
      <a class="{% if page.url contains '/members/' or page.url contains '/current-members/' or page.url contains '/alumni/' %}active{% endif %}" href="{{ '/members/' | relative_url }}">Members</a>
      <a class="{% if page.url contains '/publications/' %}active{% endif %}" href="{{ '/publications/' | relative_url }}">Publications</a>
      <a class="{% if page.url contains '/gallery/' %}active{% endif %}" href="{{ '/gallery/' | relative_url }}">Gallery</a>
      <a class="{% if page.url contains '/contact/' %}active{% endif %}" href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>
