<style>
:root {
  --global-theme-color: #003478;
  --global-hover-color: #005bac;
  --lcb-blue: #003478;
  --lcb-blue-2: #005bac;
  --lcb-navy: #061631;
  --lcb-navy-2: #08285c;
  --lcb-gold: #c7a45b;
  --lcb-coral: #e05a4f;
  --lcb-ink: #10203f;
  --lcb-muted: #617089;
  --lcb-line: #dbe5f3;
  --lcb-soft: #f5f8fc;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Noto Sans KR", "Segoe UI", sans-serif;
  color: var(--lcb-ink);
  padding-bottom: 0 !important;
  overflow-x: hidden;
  background: #fff;
}
a { color: var(--lcb-blue); }
a:hover { color: var(--lcb-blue-2); }
.post-title, .page-title, h1.post-title, header.post-header, .post-header { display: none !important; }

/* Header: force a clean visible top bar even when al-folio fallback header is used */
#navbar,
.lcb-navbar {
  position: sticky !important;
  top: 0;
  z-index: 1040;
  min-height: 76px;
  background: rgba(255,255,255,0.985) !important;
  border-bottom: 1px solid rgba(0,52,120,0.12) !important;
  box-shadow: 0 10px 30px rgba(3,22,58,0.08);
  backdrop-filter: blur(14px);
}
.lcb-nav-container,
#navbar .container,
#navbar .container-fluid {
  width: 100%;
  padding-left: clamp(20px, 4vw, 56px) !important;
  padding-right: clamp(20px, 4vw, 56px) !important;
}
.lcb-brand,
#navbar .navbar-brand {
  display: inline-flex !important;
  align-items: center !important;
  margin-right: 2rem;
  color: var(--lcb-blue) !important;
  font-weight: 900 !important;
  letter-spacing: -0.02em;
  text-decoration: none !important;
}
.lcb-brand img { height: 48px; width: auto; object-fit: contain; display: block; }
#navbar .nav-link,
.lcb-navbar .nav-link {
  color: #111827 !important;
  font-size: 0.95rem;
  font-weight: 760;
  letter-spacing: 0.01em;
  padding: 0.64rem 0.82rem !important;
  position: relative;
}
#navbar .nav-link::after,
.lcb-navbar .nav-link::after {
  content: "";
  position: absolute;
  left: 0.82rem;
  right: 0.82rem;
  bottom: 0.26rem;
  height: 2px;
  background: var(--lcb-coral);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .18s ease;
}
#navbar .nav-link.active,
#navbar .nav-link:hover,
.lcb-navbar .nav-link.active,
.lcb-navbar .nav-link:hover { color: var(--lcb-blue) !important; }
#navbar .nav-link.active::after,
#navbar .nav-link:hover::after,
.lcb-navbar .nav-link.active::after,
.lcb-navbar .nav-link:hover::after { transform: scaleX(1); }

.lcb-footer,
footer.fixed-bottom,
footer {
  position: static !important;
  bottom: auto !important;
  width: 100%;
  border-top: 1px solid var(--lcb-line);
  padding: 1rem 0;
  margin-top: 4rem;
  background: #f8fafc;
  color: #6b7280;
  font-size: 0.86rem;
  text-align: center;
}
.lcb-page { max-width: 1180px; margin: 0 auto; }
.lcb-full-bleed { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }

/* Home */
.lcb-home-page { max-width: none; }
.lcb-home-hero {
  position: relative;
  min-height: 660px;
  overflow: hidden;
  color: #fff;
  display: flex;
  align-items: center;
  background: var(--lcb-navy);
}
.lcb-home-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, rgba(4,16,39,0.98) 0%, rgba(0,52,120,0.92) 43%, rgba(0,70,150,0.45) 74%, rgba(0,52,120,0.58) 100%),
    url("{{ '/assets/img/home/hero_cancer_cells.jpg' | relative_url }}");
  background-size: cover;
  background-position: center right;
  transform: scale(1.015);
}
.lcb-home-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 11% 80%, rgba(0,91,172,.34), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(224,90,79,.20), transparent 24%);
  pointer-events: none;
}
.lcb-home-inner {
  position: relative;
  z-index: 2;
  width: min(1180px, calc(100% - 56px));
  margin: 0 auto;
  padding: 5.8rem 0 5.4rem;
}
.lcb-hero-copy { max-width: 760px; }
.lcb-hero-kicker {
  color: #bdd4ff;
  letter-spacing: .42em;
  font-size: .78rem;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 1.35rem;
}
.lcb-hero-title {
  color: #fff;
  font-size: clamp(4.1rem, 7.4vw, 7.1rem);
  line-height: .96;
  letter-spacing: -.055em;
  font-weight: 880;
  margin: 0 0 1.15rem;
}
.lcb-hero-kr {
  color: #f3f7ff;
  font-size: clamp(1.55rem, 2.5vw, 2.12rem);
  font-weight: 800;
  line-height: 1.45;
  margin: 0;
  letter-spacing: -.02em;
}
.lcb-hero-rule { width: 58px; height: 3px; background: var(--lcb-gold); margin: 1.35rem 0 1.15rem; }
.lcb-hero-lead {
  color: #edf4ff;
  font-size: clamp(1.05rem, 1.55vw, 1.24rem);
  line-height: 1.72;
  max-width: 760px;
  margin: 0 0 2.1rem;
}
.lcb-hero-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
.lcb-hero-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 172px;
  padding: 1rem 1.45rem;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.62);
  color: #fff !important;
  font-weight: 850;
  letter-spacing: .01em;
  text-decoration: none !important;
  background: rgba(255,255,255,.06);
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.lcb-hero-btn::after { content: "→"; margin-left: .7rem; }
.lcb-hero-btn.primary {
  background: #fff;
  color: var(--lcb-blue) !important;
  border-color: #fff;
}
.lcb-hero-btn.secondary { background: rgba(255,255,255,.10); }
.lcb-hero-btn:hover { transform: translateY(-2px); background: var(--lcb-blue-2); border-color: var(--lcb-blue-2); color: #fff !important; }

.lcb-home-people {
  background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 100%);
  border-bottom: 1px solid var(--lcb-line);
}
.lcb-people-inner {
  width: min(1180px, calc(100% - 56px));
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2rem;
  align-items: center;
  padding: 3.2rem 0;
}
.lcb-eyebrow { display: inline-block; color: var(--lcb-gold); font-weight: 900; letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; margin-bottom: .6rem; }
.lcb-people-copy h2,
.lcb-gallery-head h2 { color: var(--lcb-blue); font-weight: 900; letter-spacing: -.035em; margin: 0 0 .65rem; font-size: clamp(2rem, 3.2vw, 3rem); }
.lcb-people-copy p { margin: 0; color: #485670; line-height: 1.72; max-width: 760px; }
.lcb-people-actions { display: flex; gap: .9rem; flex-wrap: wrap; justify-content: flex-end; }
.lcb-people-actions a {
  min-width: 168px;
  text-align: center;
  border: 1px solid var(--lcb-line);
  border-radius: 14px;
  padding: 1.05rem 1.25rem;
  background: #fff;
  color: var(--lcb-blue) !important;
  text-decoration: none !important;
  font-weight: 850;
  box-shadow: 0 12px 26px rgba(0,52,120,.08);
}
.lcb-people-actions a::after { content: " →"; }
.lcb-people-actions a:hover { background: var(--lcb-blue); color: #fff !important; transform: translateY(-2px); }

.lcb-home-gallery {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  background: #071638;
  padding: 2.4rem 0 2.7rem;
  overflow: hidden;
  border-top: 1px solid rgba(255,255,255,.09);
}
.lcb-gallery-head { width: min(1180px, calc(100% - 56px)); margin: 0 auto 1.4rem; }
.lcb-gallery-head h2 { color: #fff; font-size: clamp(1.8rem, 2.6vw, 2.55rem); }
.lcb-slider { display: flex; gap: 1rem; width: max-content; animation: lcb-slide 58s linear infinite; will-change: transform; }
.lcb-slider:hover { animation-play-state: paused; }
.lcb-slide { width: 360px; height: 230px; flex: 0 0 auto; overflow: hidden; border-radius: 16px; background: #0b1f45; box-shadow: 0 16px 34px rgba(0,0,0,.24); }
.lcb-slide img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.03) contrast(1.02); }
@keyframes lcb-slide { from { transform: translateX(0); } to { transform: translateX(calc(-50% - .5rem)); } }

/* General pages */
.lcb-section { padding: 4.2rem 0 2rem; }
.lcb-section.compact { padding-top: 2.8rem; }
.lcb-section-title { color: var(--lcb-blue); font-size: clamp(2.4rem, 5vw, 4.4rem); font-weight: 900; line-height: 1.04; letter-spacing: -.045em; margin: 0 0 1.2rem; }
.lcb-section-title::after { content: ""; display: block; width: 56px; height: 3px; background: var(--lcb-gold); margin-top: .85rem; }
.lcb-section-lead { color: #334155; max-width: 900px; font-size: 1.08rem; line-height: 1.82; }
.lcb-card-grid,
.lcb-project-grid,
.lcb-member-grid { display: grid; gap: 1.2rem; }
.lcb-card-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.lcb-card,
.lcb-project-card,
.lcb-member,
.lcb-contact-box { border: 1px solid var(--lcb-line); border-radius: 18px; background: #fff; box-shadow: 0 15px 38px rgba(0,52,120,.08); overflow: hidden; }
.lcb-card { padding: 1.35rem; }
.lcb-card h3,
.lcb-project-body h3,
.lcb-member h3 { color: var(--lcb-blue); font-weight: 900; margin-top: 0; }
.lcb-card p,
.lcb-project-body p,
.lcb-member p { line-height: 1.65; }
.lcb-project-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 1.5rem; }
.lcb-project-card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #f0f4fa; }
.lcb-project-body { padding: 1.2rem 1.25rem 1.35rem; }
.lcb-profile-grid { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 2rem; align-items: start; }
.lcb-profile-img { width: 100%; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,52,120,.14); }
.lcb-timeline { border-left: 3px solid var(--lcb-line); padding-left: 1.2rem; }
.lcb-timeline-item { margin-bottom: 1rem; }
.lcb-timeline-year { font-weight: 900; color: var(--lcb-blue); }
.lcb-member-grid { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.lcb-member { padding: 1.15rem; }
.lcb-member img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 14px; margin-bottom: 1rem; background: #f2f6ff; }
.lcb-role { color: var(--lcb-blue); font-weight: 840; }
.lcb-member p { margin: .18rem 0; }
.lcb-people-tabs { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0 2rem; }
.lcb-tab-btn { border-radius: 999px; padding: .7rem 1rem; border: 1px solid var(--lcb-line); background: #fff; color: var(--lcb-blue); font-weight: 850; text-decoration: none !important; }
.lcb-tab-btn:hover { background: var(--lcb-blue); color: #fff; }
.lcb-gallery-carousel { width: 100vw; margin-left: calc(50% - 50vw); background: #071638; padding: 2rem 0; overflow: hidden; }
.lcb-gallery-caption-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-top: 1.7rem; }
.lcb-gallery-note { padding: 1rem 1.1rem; border-left: 3px solid var(--lcb-blue); background: #f5f8fc; color: #34405a; }
.lcb-publications { counter-reset: pubs; }
.lcb-pub-list { padding-left: 0; list-style: none; }
.lcb-pub-item { counter-increment: pubs; display: grid; grid-template-columns: 3.4rem 1fr; gap: 1rem; padding: 1.08rem 0; border-bottom: 1px solid var(--lcb-line); }
.lcb-pub-item::before { content: counter(pubs, decimal-leading-zero); color: var(--lcb-blue); font-weight: 920; font-size: 1.06rem; }
.lcb-pub-title { font-weight: 820; color: #18233c; }
.lcb-pub-meta { color: #5c667a; line-height: 1.55; }
.lcb-year { margin-top: 2.4rem; color: var(--lcb-blue); font-size: 2.1rem; font-weight: 900; }
.lcb-contact-box { padding: 1.45rem; background: linear-gradient(135deg, #f7faff 0%, #eef4ff 100%); }
.lcb-note { color: var(--lcb-muted); font-size: .95rem; }

@media (max-width: 1050px) {
  .lcb-home-hero { min-height: 600px; }
  .lcb-people-inner { grid-template-columns: 1fr; }
  .lcb-people-actions { justify-content: flex-start; }
}
@media (max-width: 720px) {
  .lcb-brand img { height: 38px; }
  #navbar, .lcb-navbar { min-height: 66px; }
  .lcb-home-hero { min-height: auto; }
  .lcb-home-inner { width: min(100% - 30px, 1180px); padding: 4.6rem 0 4.8rem; }
  .lcb-hero-title { font-size: 3.4rem; }
  .lcb-hero-lead br { display: none; }
  .lcb-people-inner, .lcb-gallery-head { width: min(100% - 30px, 1180px); }
  .lcb-slide { width: 280px; height: 188px; }
  .lcb-profile-grid { grid-template-columns: 1fr; }
}
</style>
