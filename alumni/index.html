/* ===== LCB v10 ===== */
:root{
  --lcb-blue:#003478;--lcb-blue2:#005bac;--lcb-navy:#0a1e3d;
  --lcb-gold:#c7a45b;--lcb-coral:#d9534f;--lcb-ink:#1f2937;
  --lcb-muted:#6b7280;--lcb-line:#e2e8f0;--lcb-soft:#f8fafc;
  --global-theme-color:#003478;--global-hover-color:#005bac;
}
html{scroll-behavior:smooth}
body{font-family:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--lcb-ink);overflow-x:hidden;background:#fff;margin:0;padding:0 0 0!important}
a{color:var(--lcb-blue)}a:hover{color:var(--lcb-blue2)}
.post-title,.page-title,h1.post-title,header.post-header,.post-header{display:none!important}
body.fixed-top-nav,body.sticky-bottom-footer{padding-top:0!important}
main,main.container,.container.mt-5,.post{margin-top:0!important;padding-top:0!important}

/* ── hide al-folio default header ── */
body>header:not(.lcb-topbar),header.lcb-site-header,#navbar,.navbar{display:none!important}

/* ── Topbar ── */
.lcb-topbar{position:sticky;top:0;z-index:9999;background:#fff;border-bottom:1px solid var(--lcb-line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.lcb-topbar-inner{max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,36px);height:50px;display:flex;align-items:center;justify-content:space-between}
.lcb-topbar-brand{display:inline-flex;align-items:center;gap:.45rem;color:var(--lcb-blue)!important;text-decoration:none!important;font-weight:600;font-size:.95rem;letter-spacing:-.015em;white-space:nowrap;flex-shrink:0}
.lcb-topbar-logo{height:26px;width:26px;object-fit:contain}
.lcb-topbar-links{display:flex;align-items:center;gap:clamp(.3rem,1.4vw,1.6rem)}
.lcb-topbar-links a{color:#4b5563!important;text-decoration:none!important;font-size:.84rem;font-weight:420;padding:.3rem 0;position:relative;white-space:nowrap;transition:color .15s}
.lcb-topbar-links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--lcb-coral);transform:scaleX(0);transition:transform .18s}
.lcb-topbar-links a:hover{color:var(--lcb-blue)!important}
.lcb-topbar-links a.active{color:var(--lcb-blue)!important;font-weight:550}
.lcb-topbar-links a:hover::after,.lcb-topbar-links a.active::after{transform:scaleX(1)}
.lcb-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;flex-direction:column;gap:4px}
.lcb-hamburger span{display:block;width:18px;height:1.5px;background:#4b5563;border-radius:1px}
@media(max-width:800px){
  .lcb-topbar-inner{height:46px}
  .lcb-hamburger{display:flex}
  .lcb-topbar-links{display:none;position:absolute;top:46px;left:0;right:0;background:#fff;border-bottom:1px solid var(--lcb-line);box-shadow:0 4px 12px rgba(0,0,0,.06);flex-direction:column;padding:.5rem 0;gap:0}
  .lcb-topbar-links.open{display:flex}
  .lcb-topbar-links a{padding:.6rem clamp(16px,3vw,36px);font-size:.88rem}
  .lcb-topbar-links a::after{display:none}
}

/* ── Footer ── */
footer.fixed-bottom,footer{position:static!important;bottom:auto!important}
.lcb-footer{width:100%;border-top:1px solid var(--lcb-line);padding:1rem 0;margin-top:3.5rem;background:var(--lcb-soft);text-align:center;font-size:.8rem;color:var(--lcb-muted)}

/* ── Layout ── */
.lcb-page{max-width:1060px;margin:0 auto;padding:0 clamp(16px,3vw,36px)}
.lcb-full-bleed{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.lcb-section{padding:2.5rem 0 1.2rem}
.lcb-section.compact{padding:.8rem 0 1.2rem}
.lcb-section-title{color:var(--lcb-blue);font-weight:700;letter-spacing:-.025em;font-size:1.55rem;margin:0 0 .6rem}
.lcb-section-lead{color:#374151;max-width:780px;font-size:.96rem;line-height:1.75}
.lcb-eyebrow{display:inline-block;color:var(--lcb-gold);font-weight:650;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;margin-bottom:.4rem}

/* ── Hero ── */
.lcb-home-page{max-width:none;padding:0}
.lcb-home-hero{position:relative;min-height:clamp(500px,68vh,680px);overflow:hidden;color:#fff;display:flex;align-items:center;background:linear-gradient(135deg,#081d40 0%,var(--lcb-blue) 55%,#1565c0 100%)}
.lcb-home-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(8,29,64,.95) 0%,rgba(0,52,120,.86) 43%,rgba(0,52,120,.34) 100%),url("/LCB/assets/img/home/hero_cancer_cells.jpg");background-size:cover,cover;background-repeat:no-repeat;background-position:center,center 42%}
.lcb-home-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 82%,rgba(0,91,172,.2),transparent 28%);pointer-events:none}
.lcb-home-inner{position:relative;z-index:2;max-width:1060px;width:100%;margin:0 auto;padding:4rem clamp(16px,3vw,36px) 3.8rem}
.lcb-hero-copy{max-width:640px}
.lcb-hero-kicker{color:#c4d8f8;letter-spacing:.35em;font-size:.68rem;font-weight:600;text-transform:uppercase;margin-bottom:.9rem}
.lcb-hero-title{color:#fff;font-size:clamp(2.8rem,5.5vw,5rem);line-height:.97;letter-spacing:-.045em;font-weight:750;margin:0 0 .7rem}
.lcb-hero-kr{color:#e8f0ff;font-size:clamp(1.15rem,1.8vw,1.5rem);font-weight:500;line-height:1.5;margin:0;letter-spacing:-.01em}
.lcb-hero-rule{width:42px;height:2px;background:var(--lcb-gold);margin:1rem 0 .85rem}
.lcb-hero-lead{color:#d4e3ff;font-size:clamp(.88rem,1.15vw,1rem);line-height:1.72;max-width:580px;margin:0 0 1.5rem;font-weight:400}
.lcb-hero-buttons{display:flex;gap:.7rem;flex-wrap:wrap}
.lcb-hero-btn{display:inline-flex;align-items:center;justify-content:center;min-width:136px;padding:.7rem 1.15rem;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#fff!important;font-weight:550;font-size:.84rem;text-decoration:none!important;background:rgba(255,255,255,.07);transition:all .18s}
.lcb-hero-btn.primary{background:#fff;color:var(--lcb-blue)!important;border-color:#fff}
.lcb-hero-btn:hover{transform:translateY(-1px);background:var(--lcb-blue2);border-color:var(--lcb-blue2);color:#fff!important}

/* ── Quick cards ── */
.lcb-home-quick{background:linear-gradient(180deg,#fff,#f7f9fd);border-bottom:1px solid var(--lcb-line)}
.lcb-quick-inner{max-width:1060px;margin:0 auto;padding:2rem clamp(16px,3vw,36px);display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.lcb-quick-card{background:#fff;border:1px solid var(--lcb-line);border-radius:14px;padding:1.3rem;box-shadow:0 4px 16px rgba(0,52,120,.04)}
.lcb-quick-card h2{color:var(--lcb-blue);font-size:1.2rem;font-weight:650;letter-spacing:-.02em;margin:0 0 .35rem}
.lcb-quick-card p{color:#4b5563;line-height:1.6;margin:0 0 .9rem;font-size:.88rem}
.lcb-quick-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.lcb-quick-actions a{text-decoration:none!important;border:1px solid var(--lcb-line);border-radius:999px;padding:.45rem .8rem;font-weight:550;font-size:.8rem;color:var(--lcb-blue)!important;background:#f8faff}
.lcb-quick-actions a:hover{background:var(--lcb-blue);color:#fff!important}

/* ── Slider (home gallery) ── */
.lcb-home-gallery{padding:2rem 0 2.5rem}
.lcb-gallery-head{max-width:1060px;margin:0 auto;padding:0 clamp(16px,3vw,36px) 1rem}
.lcb-gallery-head h2{color:var(--lcb-blue);font-weight:650;letter-spacing:-.025em;margin:0;font-size:1.3rem}
.lcb-slider{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(16px,3vw,36px) .8rem;scrollbar-width:thin;scrollbar-color:#c5d2e8 transparent;-webkit-overflow-scrolling:touch}
.lcb-slide{flex:0 0 clamp(220px,26vw,320px);scroll-snap-align:start;border-radius:10px;overflow:hidden;background:#f1f5fb;box-shadow:0 2px 10px rgba(0,52,120,.06)}
.lcb-slide img{width:100%;height:auto;max-height:360px;object-fit:contain;display:block;background:#f1f5fb}
.lcb-slide-caption{padding:.45rem .6rem;background:#fff;font-size:.74rem;color:#4b5563;line-height:1.4;border-top:1px solid #eef2f8}
.lcb-slide-caption strong{color:var(--lcb-ink);font-weight:600}

/* ── Gallery page grid ── */
.lcb-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-top:1rem;align-items:start}
.lcb-gallery-item{border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--lcb-line);box-shadow:0 2px 10px rgba(0,52,120,.04)}
.lcb-gallery-item img{width:100%;height:auto;display:block;background:#f1f5fb}
.lcb-gallery-item figcaption{padding:.5rem .7rem;font-size:.78rem;color:#4b5563;line-height:1.4}
.lcb-gallery-item figcaption strong{color:var(--lcb-ink)}

/* ── Cards ── */
.lcb-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem}
.lcb-card{border:1px solid var(--lcb-line);border-radius:12px;background:#fff;padding:1.1rem;box-shadow:0 2px 10px rgba(0,52,120,.03)}
.lcb-card h3{color:var(--lcb-blue);font-weight:650;font-size:.94rem;margin:0 0 .3rem}
.lcb-card p{line-height:1.6;font-size:.86rem;color:#4b5563;margin:0}

/* ── Project cards ── */
.lcb-project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.9rem;margin-top:1rem}
.lcb-project-card{border:1px solid var(--lcb-line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 2px 10px rgba(0,52,120,.03)}
.lcb-project-card img{width:100%;height:190px;object-fit:contain;background:#f7faff;padding:.4rem;display:block}
.lcb-project-body{padding:.9rem 1rem 1rem}
.lcb-project-body h3{color:var(--lcb-blue);font-weight:650;font-size:.92rem;margin:0 0 .3rem}
.lcb-project-body p{line-height:1.6;font-size:.84rem;color:#4b5563;margin:0}

/* ── Professor ── */
.lcb-profile-grid{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:1.8rem;align-items:start}
.lcb-profile-img{width:100%;border-radius:12px;box-shadow:0 6px 22px rgba(0,52,120,.08);object-fit:cover}
.lcb-timeline{border-left:2px solid var(--lcb-line);padding-left:1rem}
.lcb-timeline-item{margin-bottom:.65rem}
.lcb-timeline-year{font-weight:650;color:var(--lcb-blue);font-size:.88rem}
.lcb-timeline-item div:not(.lcb-timeline-year){font-size:.86rem;color:#4b5563}

/* ── Members ── */
.lcb-member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.9rem}
.lcb-member{border:1px solid var(--lcb-line);border-radius:12px;background:#fff;padding:.9rem;box-shadow:0 2px 10px rgba(0,52,120,.03);display:flex;flex-direction:column}
.lcb-member img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;margin-bottom:.55rem;background:#f1f5fb}
.lcb-member h3{color:var(--lcb-blue);font-weight:650;font-size:.9rem;margin:0 0 .15rem}
.lcb-role{color:var(--lcb-blue2);font-weight:550;font-size:.78rem}
.lcb-member p{margin:.1rem 0;font-size:.78rem;color:#6b7280;line-height:1.4}
.lcb-people-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 1.3rem}
.lcb-tab-btn{border-radius:999px;padding:.45rem .8rem;border:1px solid var(--lcb-line);background:#fff;color:var(--lcb-blue);font-weight:550;font-size:.8rem;text-decoration:none!important}
.lcb-tab-btn:hover{background:var(--lcb-blue);color:#fff}

/* ── Contact ── */
.lcb-contact-box{border:1px solid var(--lcb-line);border-radius:12px;padding:1.2rem;background:linear-gradient(135deg,#f8faff,#eff4ff);box-shadow:0 2px 10px rgba(0,52,120,.03)}
.lcb-contact-box p{margin:.35rem 0;font-size:.9rem}

/* ── Publications ── */
.lcb-publications{counter-reset:pubs}
.lcb-pub-list{padding-left:0;list-style:none}
.lcb-pub-item{counter-increment:pubs;display:grid;grid-template-columns:2.8rem 1fr;gap:.7rem;padding:.75rem 0;border-bottom:1px solid var(--lcb-line)}
.lcb-pub-item::before{content:counter(pubs);color:var(--lcb-blue);font-weight:700;font-size:.9rem;padding-top:.1rem}
.lcb-pub-title{font-weight:600;color:#1f2937;font-size:.88rem}
.lcb-pub-meta{color:#6b7280;line-height:1.55;font-size:.82rem}
.lcb-year{margin-top:1.8rem;color:var(--lcb-blue);font-size:1.4rem;font-weight:750}

/* ── Responsive ── */
@media(max-width:920px){.lcb-quick-inner{grid-template-columns:1fr}.lcb-home-hero{min-height:460px}.lcb-home-hero::before{background-image:linear-gradient(90deg,rgba(8,29,64,.95),rgba(0,52,120,.78)),url("/LCB/assets/img/home/hero_cancer_cells.jpg")!important;background-size:cover,cover!important;background-position:center,center!important}}
@media(max-width:720px){.lcb-home-hero{min-height:auto}.lcb-home-inner{padding:3rem clamp(16px,3vw,36px) 3.2rem}.lcb-hero-title{font-size:2.5rem}.lcb-hero-lead br{display:none}.lcb-slide{flex:0 0 230px}.lcb-slide img{max-height:300px}.lcb-profile-grid{grid-template-columns:1fr}.lcb-member-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
